name: Release

# Builds the installable ZIP.
# - release published: runs every CI gate, validates version.php against the
#   tag and attaches block_pdfexport-<version>.zip to that GitHub release.
# - workflow_dispatch: builds the ZIP of the selected ref as a workflow
#   artifact only; it never creates tags or releases.
# Pull requests never trigger this workflow.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve the release name
        id: release
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "name=build-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version metadata
        env:
          NAME: ${{ steps.release.outputs.name }}
          PUBLISH: ${{ steps.release.outputs.publish }}
        run: |
          if [ "$PUBLISH" = "true" ]; then
            bash scripts/check-version.sh --release "$NAME"
          else
            bash scripts/check-version.sh || true
          fi

      - name: Validate and build the package
        env:
          NAME: ${{ steps.release.outputs.name }}
        run: |
          bash scripts/check-package.sh
          bash scripts/package.sh "$NAME"

      - name: Upload ZIP as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: block_pdfexport-${{ steps.release.outputs.name }}
          path: block_pdfexport-${{ steps.release.outputs.name }}.zip

      - name: Attach ZIP to the GitHub release
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
          NAME: ${{ steps.release.outputs.name }}
        run: gh release upload "$TAG" "block_pdfexport-$NAME.zip" --clobber --repo "$GITHUB_REPOSITORY"
