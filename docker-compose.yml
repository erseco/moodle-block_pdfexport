---
# Local development stack for block_pdfexport: Moodle 5.3 + MariaDB 11.4.
# The plugin checkout is bind-mounted into the Moodle 5.1+ public/ web root.
services:

  moodle:
    image: erseco/alpine-moodle:${MOODLE_VERSION:-v5.3.0}
    restart: unless-stopped
    environment:
      SITE_URL: ${SITE_URL:-http://localhost}
      DB_TYPE: mariadb
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: moodle
      DB_USER: root
      DB_PASS: moodle
      DB_PREFIX: mdl_
      DEBUG: true
      MOODLE_EMAIL: ${TEST_USER_EMAIL:-admin@example.com}
      MOODLE_LANGUAGE: en
      MOODLE_SITENAME: PDF_Export_Demo
      MOODLE_USERNAME: ${TEST_USER_USERNAME:-admin}
      MOODLE_PASSWORD: ${TEST_USER_PASSWORD:-password}
      POST_CONFIGURE_COMMANDS: |
        php admin/cli/upgrade.php --non-interactive
        php public/blocks/pdfexport/scripts/setup_demo.php || echo 'setup_demo.php failed (ignored)'
    ports:
      - ${MOODLE_PORT:-80}:8080
    volumes:
      - moodledata:/var/www/moodledata
      - moodlehtml:/var/www/html
      - ./:/var/www/html/public/blocks/pdfexport:rw
    depends_on:
      - db

  db:
    image: mariadb:11.4
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: moodle
      MYSQL_ROOT_PASSWORD: moodle
    volumes:
      - dbdata:/var/lib/mysql

volumes:
  dbdata:
  moodledata:
  moodlehtml:
